# =============================================================================
# HW1 config — second floor. THE single hw1 config.
# Consumed by hw1/load.py (interactive collection) and scripts/evaluate.py
# (two-run flow: scheduler off -> baseline/, scheduler on -> mixed/).
#
# Baseline values sourced from configs/baseline.secondfloor.yaml.
# Reconciliation vs scripts/config.yaml drift (baseline.secondfloor.yaml WON on
# every conflict):
#   - actuation: scripts/config.yaml had 0.25 m / 10.0 deg -> kept 0.2 m / 6.0 deg
#   - depth.noise_std: scripts/config.yaml had 0.0 -> kept 0.005 (nonzero base so
#     light_noise_gain couples)
#   - depth light gains: scripts/config.yaml had dropout 0.9 / range 0.1 (and
#     noise gain 0.0) -> kept noise 4.0 / dropout 0.3 / range 0.4
#   - output.save_semantic: scripts/config.yaml had true -> kept false
#
# Single-seed policy: no top-level `seed:` — uncertainties.seed governs the
# per-frame depth RNG and nothing else. The spatial ZoneScheduler is seedless.
# =============================================================================

scene:
  path: "replica_v1/apartment_0/habitat/mesh_semantic.ply"

agent:
  # P0.2 snap-check result: requested (0, 8.0, 0) is above the navmesh (bounds
  # top out at y=5.37 -> snap_point returned NaN). (0, y, 0) IS on the second
  # floor: pathfinder.snap_point -> (0.0, 1.4252348, 0.0), navigable. Floor
  # heights in apartment_0: first ~= -1.57, second ~= 1.43. start_position is
  # search_traj's floor selector (snap origin + floor_tol filter), NOT cosmetic.
  start_position: [0.0, 1.4252348, 0.0]
  move_forward: 0.2
  move_backward: 0.2
  turn_left: 6.0
  turn_right: 6.0

# evaluate replay input; missing file = hard error
trajectory: trajectories/secondfloor.npy

camera:
  width: 512
  height: 512
  hfov: 90.0
  position: [0.0, 1.5, 0.0]
  orientation: [0.0, 0.0, 0.0]

birdseye:
  width: 512
  height: 512
  hfov: 90.0
  position: [0.0, 2.5, 0.0]
  orientation: [-1.5708, 0.0, 0.0]

marker:
  enabled: false
  size: [0.4, 0.05, 0.4]
  height_offset: 0.03
  forward_offset: 1.0

lighting:
  # Baseline photometric model only. Static flicker keys (amplitude/frequency/
  # phase) are absent on purpose: flicker comes exclusively from the spatial
  # zones below, which override them per frame while the agent is inside one.
  # contrast and gamma stay at 1.0 — nothing overrides them any more, but
  # apply_lighting still reads both, so the keys stay.
  brightness: 1.0
  contrast: 1.0
  gamma: 1.0
  ambient_rgb: [1.0, 1.0, 1.0]

depth:
  # Always-on baseline sensor model (unchanged from baseline.secondfloor.yaml).
  # The zones never override this block directly — they move the exposure gain,
  # and the light_*_gain coupling below turns that into depth degradation.
  enabled: true
  stuck: false
  noise_std: 0.005          # nonzero base so light_noise_gain couples
  dropout_prob: 0.0
  min_range: 0.0
  max_range: 10.0
  quantization: 0.0
  redwood: false
  redwood_multiplier: 1.0
  # --- ambient-light coupling (stress = |exposure - light_nominal|) ---
  light_nominal: 1.0
  light_noise_gain: 4.0
  light_dropout_gain: 0.3
  light_range_gain: 0.4

uncertainties:
  # SPATIAL uncertainty: degradation is a property of PLACE, not of time. A
  # frame is degraded iff the AGENT stands inside a zone; hard circular edge,
  # boundary inclusive, FIRST MATCH WINS by list order. Flicker is the only
  # effect: it modulates exposure gain as 1 + amplitude*sin(2*pi*frequency*t),
  # which apply_lighting puts on RGB and — through stress = |gain - 1| — the
  # depth.light_*_gain block above puts on depth.
  enabled: true                  # evaluate.py flips false for the baseline run
  mode: spatial                  # the only mode; anything else is a hard error
  seed: 20                       # per-frame depth RNG ONLY (zones are seedless)

  # Placed against trajectories/secondfloor.npy (350 poses, 30.84 m of travel,
  # 11.7 s at 30 fps) by the plan.md §3.1 procedure: centers at arclength
  # fractions 0.20 / 0.45 / 0.72, radius 1.5 m. Replayed frames per zone:
  # benign=67, moderate=47, severe=63, outside=173 (49%) — every zone entered
  # in ONE contiguous run, none swallows the episode, and the clean remainder
  # is the within-capture control. REGENERATING THE TRAJECTORY INVALIDATES
  # THESE CENTERS: re-run the placement, or the mixed run quietly degenerates
  # to baseline (the failure the old gap_s [8,25] schedule used to produce).
  #
  # Frequencies are chosen so sin() zero-crossings never land on a replayed
  # frame (t = i/30): a crossing needs i = 15k/f, which for 0.73/1.17/1.91 Hz
  # is integer only at k = 73/117/191 — far past the ~45 half-cycles this
  # episode contains. In-zone frames are therefore always stressed, and all
  # three stay well under the 15 Hz Nyquist limit of a 30 fps capture.
  zones:
    - name: benign               # gain 0.80-1.20: should never clip; ICP intact
      center: [3.77, 3.10]
      radius: 1.5
      flicker: { amplitude: 0.30, frequency: 0.73 }
    - name: moderate             # gain 0.40-1.60: intermittent clipping, both rails
      center: [2.22, 6.22]
      radius: 1.5
      flicker: { amplitude: 0.60, frequency: 1.17 }
    - name: severe               # gain 0.05-1.95: heavy clipping, both rails
      center: [3.05, 8.01]
      radius: 1.5
      flicker: { amplitude: 0.95, frequency: 1.91 }

display:
  scale: 1.0
  show_rgb: true
  show_depth: true
  show_birdseye: true

output:
  root: "eval/_data/second_floor/"   # evaluate appends baseline/ | mixed/
  save_rgb: true
  save_depth: true
  save_semantic: false               # ontology consumes rgb/depth only
  clear_existing: true
